    <script>
      // Kill-switch: desregistra SW viejos y limpia TODAS las caches antes de cargar la app.
      // Corre inline (no bloqueado por un SW roto). Recarga una sola vez si limpió algo.
      window.__BUILD__ = 'b2026-08-03-8'
      console.log('[grantt] build', window.__BUILD__)
      ;(function () {
        var didClean = false
        function maybeReload() {
          if (didClean && !sessionStorage.getItem('sw-cleared')) {
            sessionStorage.setItem('sw-cleared', '1')
            location.reload()
          }
        }
        var jobs = []
        if ('caches' in window) {
          jobs.push(caches.keys().then(function (ks) {
            if (ks.length) didClean = true
            return Promise.all(ks.map(function (k) { return caches.delete(k) }))
          }).catch(function () {}))
        }
        if ('serviceWorker' in navigator) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            if (regs.length) didClean = true
            return Promise.all(regs.map(function (r) { return r.unregister() }))
          }).catch(function () {}))
        }
        Promise.all(jobs).then(maybeReload)
      })()
    </script>
