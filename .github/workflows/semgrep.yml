name: Semgrep

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608  # v4.2.2
      - run: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/default
            p/security-audit
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/react
            p/nodejs
            p/secrets
